name: SNDESK Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"

  rename-sndesk-assets:
    needs: run-flutter-nightly-build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Rename rustdesk-* release assets to sndesk-*
        run: |
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/releases/$rel/assets?per_page=100" --paginate \
            --jq '.[] | [.id, .name] | @tsv' > assets.tsv
          while IFS=$'\t' read -r id name; do
            case "$name" in rustdesk-*) ;; *) continue ;; esac
            new="sndesk-${name#rustdesk-}"
            old=$(awk -F'\t' -v n="$new" '$2 == n {print $1}' assets.tsv)
            if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" --jq .name
          done < assets.tsv
